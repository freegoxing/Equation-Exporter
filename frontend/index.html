<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equation Exporter</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar">
        <div>
          <h1>Equation Exporter</h1>
          <p>公式编辑、预览与导出</p>
        </div>
        <label class="backend-picker" for="backend">
          后端
          <select id="backend">
            <option value="latex">LaTeX</option>
            <option value="typst">Typst</option>
          </select>
        </label>
        <div class="export-actions" aria-label="导出操作">
          <button type="button" data-action="save" data-output="pdf">另存为 PDF</button>
          <button type="button" data-action="save" data-output="svg">另存为 SVG</button>
          <button type="button" data-action="copy" data-output="pdf">复制 PDF</button>
          <button type="button" data-action="copy" data-output="svg">复制 SVG</button>
        </div>
      </header>

      <section class="workspace">
        <label class="pane editor-pane" for="source">
          <span class="pane-title">公式输入</span>
          <textarea id="source" spellcheck="false" placeholder="例如：\frac{a}{b}"></textarea>
        </label>
        <section class="pane preview-pane" aria-labelledby="preview-title">
          <h2 id="preview-title" class="pane-title">预览</h2>
          <div id="preview" aria-live="polite"></div>
        </section>
      </section>

      <footer id="status" class="status" aria-live="polite">输入公式后将在此处预览</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
